<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Propiedad</title>
</head>
<body>

<h1>Formulario de Propiedad</h1>

<form th:action="@{/propiedades/guardar}" th:object="${propiedad}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Dirección:</label>
    <input type="text" th:field="*{direccion}">
    <br><br>

    <label>Ciudad:</label>
    <select th:field="*{ciudad}">
        <option value="">Seleccione una ciudad</option>
        <option th:each="c : ${ciudades}"
                th:value="${c.id}"
                th:text="${c.nombre}">
        </option>
    </select>
    <br><br>

    <label>Tipo de propiedad:</label>
    <select th:field="*{tipoPropiedad}">
        <option value="">Seleccione un tipo</option>
        <option th:each="t : ${tipos}"
                th:value="${t}"
                th:text="${t}">
        </option>
    </select>
    <br><br>

    <label>Cantidad de ambientes:</label>
    <input type="number" th:field="*{cantidadAmbientes}">
    <br><br>

    <label>Metros cuadrados:</label>
    <input type="number" step="0.01" th:field="*{metrosCuadrados}">
    <br><br>

    <label>Descripción:</label>
    <input type="text" th:field="*{descripcion}">
    <br><br>

    <label>Estado:</label>
    <select th:field="*{estado}">
        <option th:each="e : ${estados}"
                th:value="${e}"
                th:text="${e}">
        </option>
    </select>
    <br><br>

    <label>Propietario:</label>
    <select th:field="*{propietario}">
        <option value="">Seleccione un propietario</option>
        <option th:each="persona : ${personas}"
                th:value="${persona.id}"
                th:text="${persona.nombre + ' ' + persona.apellido}">
        </option>
    </select>
    <br><br>

    <button type="submit">Guardar</button>
    <a th:href="@{/propiedades}">Volver</a>

</form>

</body>
</html>
