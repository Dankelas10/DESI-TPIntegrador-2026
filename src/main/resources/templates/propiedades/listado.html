<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Propiedades</title>
</head>
<body>

<h1>Listado de Propiedades</h1>

<div th:if="${mensajeExito}">
    <p style="color:green;" th:text="${mensajeExito}"></p>
</div>

<div th:if="${mensajeError}">
    <p style="color:red;" th:text="${mensajeError}"></p>
</div>

<form th:action="@{/propiedades}" method="get">

    <label>Dirección:</label>
    <input type="text" name="direccion" th:value="${direccion}">

    <label>Ciudad:</label>
    <select name="ciudadId">
        <option value="">Todas</option>
        <option th:each="c : ${ciudades}"
                th:value="${c.id}"
                th:text="${c.nombre}"
                th:selected="${ciudadId != null and ciudadId == c.id}">
        </option>
    </select>

    <label>Tipo:</label>
    <select name="tipo">
        <option value="">Todos</option>
        <option th:each="t : ${tipos}"
                th:value="${t}"
                th:text="${t}"
                th:selected="${tipoSeleccionado != null and tipoSeleccionado == t}">
        </option>
    </select>

    <label>Estado:</label>
    <select name="estado">
        <option value="">Todos</option>
        <option th:each="e : ${estados}"
                th:value="${e}"
                th:text="${e}"
                th:selected="${estadoSeleccionado != null and estadoSeleccionado == e}">
        </option>
    </select>

    <button type="submit">Filtrar</button>
    <a th:href="@{/propiedades}">Limpiar</a>

</form>

<br>

<a th:href="@{/propiedades/nueva}">Nueva propiedad</a>

<br><br>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Dirección</th>
            <th>Ciudad</th>
            <th>Tipo</th>
            <th>Ambientes</th>
            <th>M2</th>
            <th>Estado</th>
            <th>Propietario</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="propiedad : ${propiedades}">
            <td th:text="${propiedad.id}"></td>
            <td th:text="${propiedad.direccion}"></td>
            <td th:text="${propiedad.ciudad != null ? propiedad.ciudad.nombre : ''}"></td>
            <td th:text="${propiedad.tipoPropiedad}"></td>
            <td th:text="${propiedad.cantidadAmbientes}"></td>
            <td th:text="${propiedad.metrosCuadrados}"></td>
            <td th:text="${propiedad.estado}"></td>
            <td th:text="${propiedad.propietario != null ? propiedad.propietario.nombre + ' ' + propiedad.propietario.apellido : ''}"></td>
            <td>
                <a th:href="@{/propiedades/editar/{id}(id=${propiedad.id})}">Editar</a>
                |
                <a th:href="@{/propiedades/eliminar/{id}(id=${propiedad.id})}">Eliminar</a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
