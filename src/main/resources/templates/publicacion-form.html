<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Publicación</title>
</head>
<body>

<h1>Nueva Publicación</h1>

<<form th:action="${publicacion.id == null} ? @{/publicaciones/guardar} : @{/publicaciones/actualizar}" 
      th:object="${publicacion}" 
      method="post">
	
	<input type="hidden" th:field="*{id}">

	<label>Propiedad:</label>

	<div th:if="${publicacion.id == null}">
	    <select name="propiedadId" required>
	        <option value="">Seleccione una propiedad</option>
	        <option th:each="propiedad : ${propiedades}"
	                th:value="${propiedad.id}"
	                th:text="${propiedad.direccion + ' - ' + propiedad.ciudad.nombre + ' (' + propiedad.ciudad.codigoPostal + ')'}">
	        </option>
	    </select>
	</div>

	<div th:if="${publicacion.id != null}">
	    <span th:text="${publicacion.propiedad.direccion + ' - ' + publicacion.propiedad.ciudad.nombre + ' (' + publicacion.propiedad.ciudad.codigoPostal + ')'}"></span>
	    <input type="hidden" name="propiedadId" th:value="${publicacion.propiedad.id}">
	</div>

    <br><br>

    <label>Precio mensual:</label>
    <input type="number" step="0.01" th:field="*{precioMensual}" required>

    <br><br>

    <label>Condiciones:</label>
    <input type="text" th:field="*{condiciones}">

    <br><br>

	<label>Descripción:</label>
	<textarea th:field="*{descripcion}"></textarea>

	<br><br>

	<label>Estado:</label>
	<select th:field="*{estado}">
	    <option th:each="estado : ${estadosPublicacion}"
	            th:value="${estado}"
	            th:text="${estado}">
	    </option>
	</select>

	<br><br>

	<button type="submit">Guardar</button>

</form>

<br>

<a th:href="@{/publicaciones}">Volver al listado</a>

</body>
</html>
