<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Publicación</title>
</head>
<body>

<h1>Nueva Publicación</h1>

<form th:action="@{/publicaciones/guardar}" th:object="${publicacion}" method="post">

    <label>Propiedad:</label>
    <select th:field="*{propiedad}" required>
        <option value="">Seleccione una propiedad</option>
        <option th:each="propiedad : ${propiedades}"
                th:value="${propiedad.id}"
                th:text="${propiedad.direccion}">
        </option>
    </select>

    <br><br>

    <label>Precio mensual:</label>
    <input type="number" step="0.01" th:field="*{precioMensual}" required>

    <br><br>

    <label>Condiciones:</label>
    <input type="text" th:field="*{condiciones}">

    <br><br>

    <label>Descripción:</label>
    <textarea th:field="*{descripcion}"></textarea>

    <br><br>

    <button type="submit">Guardar</button>

</form>

<br>

<a th:href="@{/publicaciones}">Volver al listado</a>

</body>
</html>
