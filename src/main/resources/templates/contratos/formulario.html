<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Contrato</title>
</head>
<body>

<h1>Formulario de Contrato</h1>

<form th:action="@{/contratos/guardar}" th:object="${contrato}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Propiedad:</label>
    <select th:field="*{propiedad}">
        <option value="">Seleccione una propiedad</option>
        <option th:each="p : ${propiedades}"
                th:value="${p.id}"
                th:text="${p.direccion}">
        </option>
    </select>
    <br><br>

    <label>Inquilino:</label>
    <select th:field="*{inquilino}">
        <option value="">Seleccione una persona</option>
        <option th:each="persona : ${personas}"
                th:value="${persona.id}"
                th:text="${persona.nombre + ' ' + persona.apellido}">
        </option>
    </select>
    <br><br>

    <label>Fecha inicio:</label>
    <input type="date" th:field="*{fechaInicio}">
    <br><br>

    <label>Duración en meses:</label>
    <input type="number" th:field="*{duracionMeses}">
    <br><br>

    <label>Importe mensual:</label>
    <input type="number" step="0.01" th:field="*{importeMensual}">
    <br><br>

    <label>Día vencimiento mensual:</label>
    <input type="number" th:field="*{diaVencimientoMensual}">
    <br><br>

    <label>Descripción:</label>
    <textarea th:field="*{descripcion}"></textarea>
    <br><br>

    <label>Estado:</label>
    <select th:field="*{estado}">
        <option th:each="e : ${estados}"
                th:value="${e}"
                th:text="${e}">
        </option>
    </select>
    <br><br>

    <button type="submit">Guardar</button>
    <a th:href="@{/contratos}">Volver</a>

</form>

</body>
</html>
